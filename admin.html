    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0F1117; --bg-card: #1A1D26; --bg-hover: #22263A; --bg-input: #2A2F45;
      --accent: #E41E3F; --accent-dim: rgba(228,30,63,0.12);
      --green: #22C55E; --green-dim: rgba(34,197,94,0.12);
      --blue: #3B82F6; --blue-dim: rgba(59,130,246,0.12);
      --yellow: #F59E0B; --yellow-dim: rgba(245,158,11,0.12);
      --border: rgba(255,255,255,0.08);
      --t0: #F9FAFB; --t1: #D1D5DB; --t2: #9CA3AF; --t3: #6B7280;
      --r: 10px;

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--t1); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── TOP BAR ── */
    .topbar { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 1.5rem; background: rgba(15,17,23,0.95); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; gap: 1rem; }
    .topbar-brand { font-size: .95rem; font-weight: 900; color: var(--t0); letter-spacing: -.03em; white-space: nowrap; }
    .topbar-brand span { color: var(--accent); }
    .topbar-badge { font-size: .58rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: var(--accent-dim); color: var(--accent); padding: .2rem .6rem; border-radius: 100px; border: 1px solid rgba(228,30,63,0.2); white-space: nowrap; }
    .topbar-spacer { flex: 1; }

    /* controls in topbar */
    .ctrl-group { display: flex; flex-direction: column; gap: 2px; }
    .ctrl-label { font-size: .55rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--t3); }
    .brand-select { background: var(--bg-input); border: 1px solid var(--border); border-radius: 7px; color: var(--t0); font-size: .78rem; font-weight: 600; padding: .35rem .65rem; font-family: inherit; cursor: pointer; outline: none; transition: border-color .15s; }
    .brand-select:hover, .brand-select:focus { border-color: rgba(255,255,255,0.2); }
    .brand-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .lang-tabs { display: flex; background: var(--bg-input); border-radius: 7px; padding: 3px; gap: 2px; }
    .lang-tab { font-size: .68rem; font-weight: 700; padding: .28rem .65rem; border-radius: 5px; border: none; background: none; color: var(--t2); cursor: pointer; font-family: inherit; transition: all .15s; }
    .lang-tab.active { background: var(--accent); color: #fff; }
    .lang-tab:hover:not(.active) { color: var(--t0); background: rgba(255,255,255,0.06); }
    .topbar-divider { width: 1px; height: 32px; background: var(--border); flex-shrink: 0; }

    /* ── LAYOUT ── */
    .wrap { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .filter-label { font-size: .62rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--t3); flex-shrink: 0; }
    .gf-pills { display: flex; gap: .3rem; flex-wrap: wrap; flex: 1; }
    .gf-pill { font-size: .65rem; font-weight: 700; padding: .28rem .7rem; border-radius: 100px; border: 1px solid var(--border); background: none; color: var(--t2); cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
    .gf-pill.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .gf-pill:hover:not(.active) { border-color: rgba(255,255,255,0.18); color: var(--t0); }

    /* ── BULK BAR ── */
    .bulk-bar { display: flex; align-items: center; gap: .75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .bulk-bar-info { flex: 1; min-width: 80px; }
    .bulk-count { font-size: .82rem; font-weight: 700; color: var(--t0); }
    .bulk-sub { font-size: .65rem; color: var(--t3); margin-top: 1px; }
    .btn { display: inline-flex; align-items: center; gap: .35rem; font-size: .75rem; font-weight: 700; border: none; cursor: pointer; padding: .5rem 1.1rem; border-radius: 7px; transition: all .15s; white-space: nowrap; font-family: inherit; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .btn-ghost { background: var(--bg-hover); color: var(--t0); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #2A2F45; }
    .btn-sm { padding: .38rem .9rem; font-size: .7rem; }

    /* ── CALENDAR ── */
    .date-section { margin-bottom: 1.5rem; }
    .date-header { display: flex; align-items: center; gap: .75rem; margin-bottom: .6rem; }
    .date-header-line { flex: 1; height: 1px; background: var(--border); }
    .date-header-text { font-size: .68rem; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
    .match-list { display: flex; flex-direction: column; gap: .4rem; }

    /* ── MATCH ROW ── */
    .match-row { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); display: flex; align-items: center; padding: .7rem 1rem; gap: .75rem; transition: border-color .15s, background .15s; }
    .match-row:hover { border-color: rgba(255,255,255,0.14); background: var(--bg-hover); }
    .match-row.hidden { display: none; }
    .match-row.generated { border-color: rgba(34,197,94,0.25); }
    .match-check { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
    .match-teams { flex: 1; min-width: 0; display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .match-flag { font-size: 1.25rem; line-height: 1; flex-shrink: 0; }
    .match-name { font-size: .82rem; font-weight: 700; color: var(--t0); white-space: nowrap; }
    .match-vs { font-size: .62rem; color: var(--t3); font-weight: 600; padding: 0 .15rem; flex-shrink: 0; }
    .match-badges { display: flex; align-items: center; gap: .35rem; flex-shrink: 0; }
    .match-group { font-size: .6rem; font-weight: 700; color: var(--blue); background: var(--blue-dim); padding: .14rem .48rem; border-radius: 100px; white-space: nowrap; }
    .match-time { font-size: .62rem; font-weight: 600; color: var(--t2); white-space: nowrap; }
    .match-venue { font-size: .6rem; color: var(--t3); white-space: nowrap; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
    .status-pill { font-size: .58rem; font-weight: 700; padding: .16rem .52rem; border-radius: 100px; flex-shrink: 0; white-space: nowrap; }
    .status-pill.ready { background: var(--green-dim); color: var(--green); }
    .status-pill.pending { background: rgba(255,255,255,0.05); color: var(--t3); }
    .match-actions { display: flex; gap: .35rem; flex-shrink: 0; }

    /* ── PROGRESS ── */
    .progress-wrap { margin-top: 1rem; display: none; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; }
    .progress-wrap.visible { display: block; }
    .progress-bar-outer { height: 4px; background: rgba(255,255,255,0.07); border-radius: 100px; overflow: hidden; margin-bottom: .4rem; }
    .progress-bar-inner { height: 100%; background: var(--accent); border-radius: 100px; transition: width .3s ease; width: 0%; }
    .progress-label { font-size: .64rem; color: var(--t2); }

    /* ── LOG ── */
    .log-section { margin-top: 1.25rem; }
    .log-title { font-size: .62rem; font-weight: 700; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4rem; }
    .log { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: .7rem 1rem; min-height: 64px; max-height: 180px; overflow-y: auto; font-family: 'SFMono-Regular', 'Consolas', monospace; font-size: .7rem; line-height: 1.75; color: var(--t2); }
    .log::-webkit-scrollbar { width: 4px; }
    .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .log-line { display: block; }
    .log-line.ok { color: var(--green); }
    .log-line.info { color: var(--blue); }
    .log-line.warn { color: var(--yellow); }

    /* ── LIVE LOAD BAR ── */
    .live-bar { display: flex; align-items: flex-end; gap: .75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--r); padding: .75rem 1rem; margin-top: 1rem; flex-wrap: wrap; }
    .api-input { background: var(--bg-input); border: 1px solid var(--border); border-radius: 7px; color: var(--t0); font-size: .75rem; padding: .38rem .75rem; font-family: inherit; outline: none; width: 260px; transition: border-color .15s; }
    .api-input:focus { border-color: rgba(255,255,255,0.25); }
    .live-status { font-size: .7rem; color: var(--t2); align-self: center; flex: 1; min-width: 120px; }
    .live-status.ok { color: var(--green); }
    .live-status.err { color: var(--accent); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .topbar { flex-wrap: wrap; height: auto; padding: .6rem 1rem; gap: .5rem; }
      .match-venue { display: none; }
      .wrap { padding: 1rem .75rem 2rem; }
    }
    @media (max-width: 500px) {
      .match-time { display: none; }
      .topbar-divider { display: none; }
    }
  </style>
</head>

  </div>

    <div class="ctrl-label">Language</div>

      <button class="lang-tab" onclick="setLang('de')">DE</button>
      <button class="lang-tab" onclick="setLang('tr')">TR</button>
    </div>
  </div>
</div>

<div class="wrap">

    <div class="gf-pills" id="groupPills"></div>
  </div>

  <div class="bulk-bar">

    </div>

    <button class="btn btn-primary" id="genBtn" onclick="generateSelected()" disabled>Generate Selected</button>
  </div>

  <div id="calendar"></div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBar"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>

  <div class="log-section">
    <div class="log-title">Output Log</div>
    <div class="log" id="log"><span class="log-line">Ready. Select brand, language and matches, then click Generate.</span></div>
  </div>

  <div class="live-bar">
    <div class="ctrl-group">

    <button class="btn btn-primary" onclick="loadLiveMatches()">&#9889; Load Matches</button>
    <span class="live-status" id="liveStatus">Enter key &rarr; Discover leagues &rarr; Load</span>
  </div>
</div>

    .mh-kick{font-size:1.6rem;font-weight:900;color:var(--t0);letter-spacing:-.04em;line-height:1;}
    .mh-date{font-size:.72rem;font-weight:600;color:var(--t2);}
    .mh-venue{font-size:.65rem;color:var(--t3);margin-top:.1rem;}
    .mh-foot{padding:0 1.25rem 1.1rem;display:flex;justify-content:center;}
    .odds-strip{display:flex;gap:.4rem;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--r-lg);padding:.4rem;width:100%;max-width:400px;}
    .odds-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:.12rem;padding:.55rem .5rem;border-radius:var(--r-md);cursor:pointer;transition:all .15s;}
    .odds-btn:hover{background:var(--accent-dim);}
    .odds-btn-label{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);}
    .odds-btn-val{font-size:1rem;font-weight:800;color:var(--t0);letter-spacing:-.02em;}
    .odds-btn-team{font-size:.6rem;font-weight:500;color:var(--t2);}
    .tabs{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);padding:.3rem;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex:1;text-align:center;font-size:.72rem;font-weight:600;color:var(--t2);padding:.52rem .75rem;border-radius:var(--r-md);cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;}
    .tab:hover{color:var(--t0);background:var(--bg-muted);}
    .tab.active{background:var(--accent);color:#fff;font-weight:700;}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-xs);overflow:hidden;}
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.1rem;border-bottom:1px solid var(--border-subtle);}
    .card-title{display:flex;align-items:center;gap:.45rem;font-size:.78rem;font-weight:700;color:var(--t0);}
    .card-icon{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;}
    .card-chip{font-size:.6rem;font-weight:700;color:var(--t3);background:var(--bg-input);padding:.15rem .5rem;border-radius:100px;}
    .card-body{padding:1rem 1.1rem;}
    .stat-row{display:flex;align-items:center;gap:.5rem;padding:.6rem 0;}
    .stat-row+.stat-row{border-top:1px solid var(--border-subtle);}
    .sv{width:44px;flex-shrink:0;font-size:.8rem;font-weight:700;color:var(--t1);text-align:center;}
    .sv.lead{color:var(--blue);}
    .sn{flex:0 0 104px;text-align:center;font-size:.68rem;font-weight:500;color:var(--t2);}
    .sh{flex:1;height:5px;border-radius:100px;background:var(--bg-input);overflow:hidden;direction:rtl;}
    .sh-fill{height:100%;border-radius:100px;background:var(--blue);direction:ltr;}
    .sa{flex:1;height:5px;border-radius:100px;background:var(--bg-input);overflow:hidden;}
    .sa-fill{height:100%;border-radius:100px;background:var(--accent);}
    .prob-bar{display:flex;border-radius:100px;overflow:hidden;height:32px;font-size:.68rem;font-weight:700;}
    .ps{display:flex;align-items:center;justify-content:center;color:#fff;transition:width .7s ease;}
    .ps.home{background:var(--blue);}
    .ps.draw{background:#9CA3AF;}
    .ps.away{background:var(--accent);}
    .prob-labels{display:flex;justify-content:space-between;margin-top:.45rem;font-size:.65rem;font-weight:600;color:var(--t2);}
    .form-section{display:flex;flex-direction:column;gap:.85rem;}
    .form-row{display:flex;align-items:center;gap:.75rem;}
    .form-meta{display:flex;align-items:center;gap:.4rem;min-width:96px;flex-shrink:0;}
    .form-flag{font-size:1rem;}
    .form-label{font-size:.72rem;font-weight:700;color:var(--t1);}
    .form-badges{display:flex;gap:.3rem;flex:1;}
    .fb{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:800;transition:transform .15s;cursor:default;}
    .fb:hover{transform:scale(1.12);}
    .fb.w{background:var(--green-dim);color:var(--green);}
    .fb.d{background:var(--yellow-dim);color:var(--yellow);}
    .fb.l{background:var(--red-dim);color:var(--red);}
    .form-record{font-size:.68rem;font-weight:600;color:var(--t2);white-space:nowrap;}
    .ml-item{display:flex;align-items:center;gap:.5rem;padding:.65rem 0;}
    .ml-item+.ml-item{border-top:1px solid var(--border-subtle);}
    .ml-date{font-size:.64rem;font-weight:500;color:var(--t3);width:68px;flex-shrink:0;}
    .ml-teams{flex:1;font-size:.76rem;color:var(--t2);display:flex;align-items:center;gap:.3rem;}
    .ml-teams .w{font-weight:700;color:var(--t0);}
    .ml-score{background:var(--bg-input);border-radius:6px;padding:.2rem .55rem;font-size:.74rem;font-weight:800;color:var(--t0);letter-spacing:.04em;flex-shrink:0;}
    .ml-comp{font-size:.6rem;font-weight:500;color:var(--t3);width:60px;text-align:right;flex-shrink:0;}
    .market{margin-bottom:.85rem;}
    .market:last-child{margin-bottom:0;}
    .mkt-label{font-size:.63rem;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.4rem;}
    .mkt-row{display:flex;gap:.35rem;}
    .mkt-btn{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--r-sm);padding:.6rem .75rem;cursor:pointer;transition:all .15s;}
    .mkt-btn:hover{border-color:var(--accent);background:var(--accent-dim);}
    .mkt-btn-label{font-size:.7rem;color:var(--t1);font-weight:500;}
    .mkt-btn-val{font-size:.82rem;font-weight:800;color:var(--t0);}
    .player-row{display:flex;align-items:center;gap:.65rem;padding:.6rem 0;}
    .player-row+.player-row{border-top:1px solid var(--border-subtle);}
    .player-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg-input);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;}
    .player-info{flex:1;min-width:0;}
    .player-name{font-size:.78rem;font-weight:700;color:var(--t0);}
    .player-detail{font-size:.64rem;color:var(--t2);font-weight:500;margin-top:.1rem;}
    .player-stat{text-align:right;flex-shrink:0;}
    .player-stat-val{font-size:.88rem;font-weight:800;color:var(--t0);}
    .player-stat-label{font-size:.6rem;color:var(--t3);font-weight:500;}
    .preview-text{font-size:.82rem;color:var(--t1);line-height:1.75;}
    .preview-text+.preview-text{margin-top:.65rem;}
    .preview-highlight{background:var(--accent-dim);border-left:3px solid var(--accent);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:.75rem 1rem;margin-top:.85rem;font-size:.78rem;color:var(--t1);font-weight:500;line-height:1.65;}
    .side-cta{border-radius:var(--r-xl);padding:1.5rem 1.25rem;text-align:center;box-shadow:var(--shadow-md);background:linear-gradient(150deg,${accentHex} 0%,color-mix(in srgb,${accentHex} 70%,#000) 100%);}
    .side-cta-eyebrow{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.65);margin-bottom:.4rem;}
    .side-cta-headline{font-size:1.35rem;font-weight:900;line-height:1.2;color:#fff;letter-spacing:-.03em;margin-bottom:.35rem;}
    .side-cta-sub{font-size:.7rem;color:rgba(255,255,255,0.65);margin-bottom:1.1rem;line-height:1.5;}
    .side-cta-btn{display:inline-flex;align-items:center;gap:.3rem;background:#fff;color:${accentHex};font-size:.78rem;font-weight:800;padding:.65rem 1.6rem;border-radius:100px;transition:all .15s;}
    .side-cta-btn:hover{transform:scale(1.03);box-shadow:0 4px 20px rgba(0,0,0,.2);}
    .venue-row{display:flex;align-items:center;padding:.5rem 0;justify-content:space-between;}
    .venue-row+.venue-row{border-top:1px solid var(--border-subtle);}
    .venue-key{font-size:.7rem;color:var(--t2);font-weight:500;}
    .venue-val{font-size:.76rem;font-weight:700;color:var(--t0);}
    footer{max-width:1100px;margin:0 auto;padding:1.5rem 1rem;border-top:1px solid var(--border);text-align:center;}
    .footer-brand{font-size:.9rem;font-weight:900;color:var(--t2);margin-bottom:.5rem;}
    .footer-brand span{color:var(--accent);}
    .footer-disc{font-size:.64rem;color:var(--t3);max-width:540px;margin:0 auto;line-height:1.7;}
    .footer-links{display:flex;justify-content:center;gap:1.25rem;margin-top:.75rem;flex-wrap:wrap;}
    .footer-links a{font-size:.67rem;color:var(--t3);transition:color .15s;}
    .footer-links a:hover{color:var(--t1);}
    .mob-bar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--bg-card);border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(0,0,0,.10);padding:.75rem 1rem;align-items:center;gap:.75rem;}
    .mob-bar-info{flex:1;}
    .mob-bar-label{font-size:.63rem;color:var(--t3);font-weight:500;}
    .mob-bar-val{font-size:.88rem;font-weight:800;color:var(--t0);}
    .mob-bar-btn{background:var(--accent);color:#fff;padding:.5rem 1.1rem;border-radius:var(--r-sm);white-space:nowrap;transition:filter .15s;display:flex;flex-direction:column;align-items:center;gap:.05rem;text-align:center;}
    .mob-bar-btn:hover{filter:brightness(1.08);}
    .mob-bar-btn-main{font-size:.82rem;font-weight:800;line-height:1.2;}
    .mob-bar-btn-sub{font-size:.62rem;font-weight:600;opacity:.88;}
    body{padding-bottom:76px;}
    @media(min-width:861px){body{padding-bottom:0;}.mob-bar{display:none;}}
    @media(max-width:860px){.page{grid-template-columns:1fr;}.match-header{grid-column:1;}.sidebar{order:10;}}
    @media(max-width:600px){.page{padding:.6rem .5rem;gap:.75rem;}.mh-body{padding:1.25rem .5rem 1rem;}.mh-flag{font-size:2.75rem;}.mh-name{font-size:.9rem;}.mh-sub{font-size:.62rem;padding:.12rem .4rem;}.mh-center{padding:0 .75rem;}.mh-kick{font-size:1.25rem;}.mh-date{font-size:.65rem;}.mh-venue{display:none;}.sn{flex:0 0 76px;font-size:.62rem;}.sv{width:34px;font-size:.7rem;}.topbar-cta{display:none;}.ml-comp{display:none;}.ml-date{width:52px;}.form-meta{min-width:76px;}.card-body{padding:.85rem;}.card-head{padding:.7rem .85rem;}}
    @media(max-width:380px){.mh-flag{font-size:2.25rem;}.mh-name{font-size:.82rem;}.mh-sub{font-size:.58rem;}.mh-kick{font-size:1.1rem;}.mh-center{padding:0 .4rem;}.tabs .tab{font-size:.65rem;padding:.45rem .5rem;}}
  </style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <a href="index.html" class="topbar-back" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <a href="index.html" class="topbar-brand">${logoHtml}</a>
    </div>
    <div class="topbar-right">
      <a href="${aff}" class="topbar-cta" target="_blank" rel="noopener">${t.placeBet}</a>
    </div>
  </div>
</div>
<div class="page">
  <div class="match-header">
    <div class="mh-top">
      <div class="mh-tourney">
        <div class="mh-tourney-badge">\u26bd</div>
        ${m.tournament || 'FIFA World Cup 2026'} &bull; ${m.group}
      </div>
      <div class="mh-status"><span class="mh-dot"></span> ${t.upcoming}</div>
    </div>
    <div class="mh-body">
      <div class="mh-team">
        <div class="mh-flag">${ht.flag}</div>
        <div class="mh-name">${ht.name}</div>
        <div class="mh-sub">${ht.fifa ? 'FIFA #' + ht.fifa + (ht.role ? ' &middot; ' + ht.role : '') : (ht.role || 'World Cup 2026')}</div>
      </div>
      <div class="mh-center">
        <div class="mh-kick">${m.kickoff || "TBC"}</div>
        <div class="mh-date">${m.date || ""}</div>
        <div class="mh-venue">${m.venue || ""}</div>
      </div>
      <div class="mh-team">
        <div class="mh-flag">${at.flag}</div>
        <div class="mh-name">${at.name}</div>
        <div class="mh-sub">${at.fifa ? 'FIFA #' + at.fifa + (at.role ? ' &middot; ' + at.role : '') : (at.role || 'World Cup 2026')}</div>
      </div>
    </div>
    <div class="mh-foot">
      <div class="odds-strip">
        <a href="${aff}" class="odds-btn" target="_blank" rel="noopener">
          <span class="odds-btn-label">${t.homeWin}</span>
          <span class="odds-btn-val">${(+m.odds.home).toFixed(2)}</span>
          <span class="odds-btn-team">${ht.name}</span>
        </a>
        <a href="${aff}" class="odds-btn" target="_blank" rel="noopener">
          <span class="odds-btn-label">${t.draw}</span>
          <span class="odds-btn-val">${(+m.odds.draw).toFixed(2)}</span>
          <span class="odds-btn-team">${t.after90}</span>
        </a>
        <a href="${aff}" class="odds-btn" target="_blank" rel="noopener">
          <span class="odds-btn-label">${t.awayWin}</span>
          <span class="odds-btn-val">${(+m.odds.away).toFixed(2)}</span>
          <span class="odds-btn-team">${at.name}</span>
        </a>
      </div>
    </div>
  </div>
  <div class="main" style="display:flex;flex-direction:column;gap:1rem;">
    <div class="tabs">
      <div class="tab active">${t.tabPreview}</div>
      <div class="tab">${t.tabStats}</div>
      <div class="tab">${t.tabOdds}</div>
      <div class="tab">${t.tabH2H}</div>
      <div class="tab">${t.tabForm}</div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon" style="background:var(--blue-dim);">\uD83D\uDCCB</span> ${t.matchPreview}</div>
      </div>
      <div class="card-body">
        ${getLang(m.previewLines).map(function(l) { return '<p class="preview-text">' + l + '</p>'; }).join("\n        ")}
        <div class="preview-highlight">${getLang(m.previewHighlight)}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon" style="background:var(--green-dim);">\uD83D\uDCCA</span> ${t.winProbability}</div>
        <span class="card-chip">${t.basedOn(brandName)}</span>
      </div>
      <div class="card-body">
        <div class="prob-bar">
          <div class="ps home" style="width:${m.probHome}%;">${m.probHome}%</div>
          <div class="ps draw" style="width:${m.probDraw}%;">${m.probDraw}%</div>
          <div class="ps away" style="width:${m.probAway}%;">${m.probAway}%</div>
        </div>
        <div class="prob-labels">
          <span>${ht.flag} ${ht.name}</span><span>${t.draw}</span><span>${at.name} ${at.flag}</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon" style="background:var(--accent-dim);">\u2694\uFE0F</span> ${t.teamComparison}</div>
        <div style="display:flex;gap:1rem;font-size:.65rem;font-weight:700;">
          <span style="color:var(--blue);">&bull; ${ht.code}</span>
          <span style="color:var(--accent);">&bull; ${at.code}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="stat-row">
          <span class="sv${leadH}">${ht.fifa}</span>
          <div class="sh"><div class="sh-fill" style="width:${fifaH}%;"></div></div>
          <span class="sn">${t.fifaRanking}</span>
          <div class="sa"><div class="sa-fill" style="width:${fifaA}%;"></div></div>
          <span class="sv${leadA}">${at.fifa}</span>
        </div>
        <div class="stat-row">
          <span class="sv${ht.elo >= at.elo ? " lead" : ""}">${ht.elo}</span>
          <div class="sh"><div class="sh-fill" style="width:${eloH}%;"></div></div>
          <span class="sn">${t.eloRating}</span>
          <div class="sa"><div class="sa-fill" style="width:${eloA}%;"></div></div>
          <span class="sv${at.elo > ht.elo ? " lead" : ""}">${at.elo}</span>
        </div>
        <div class="stat-row">
          <span class="sv">${ht.squadValue}</span>
          <div class="sh"><div class="sh-fill" style="width:${sqH}%;"></div></div>
          <span class="sn">${t.squadValue}</span>
          <div class="sa"><div class="sa-fill" style="width:${sqA}%;"></div></div>
          <span class="sv">${at.squadValue}</span>
        </div>
        <div class="stat-row">
          <span class="sv${ht.goalsPerGame >= at.goalsPerGame ? " lead" : ""}">${ht.goalsPerGame}</span>
          <div class="sh"><div class="sh-fill" style="width:${gpH}%;"></div></div>
          <span class="sn">${t.goalsPerMatch}</span>
          <div class="sa"><div class="sa-fill" style="width:${gpA}%;"></div></div>
          <span class="sv${at.goalsPerGame > ht.goalsPerGame ? " lead" : ""}">${at.goalsPerGame}</span>
        </div>
        <div class="stat-row">
          <span class="sv${ht.concededPerGame <= at.concededPerGame ? " lead" : ""}">${ht.concededPerGame}</span>
          <div class="sh"><div class="sh-fill" style="width:${cpH}%;"></div></div>
          <span class="sn">${t.concededPerMatch}</span>
          <div class="sa"><div class="sa-fill" style="width:${cpA}%;"></div></div>
          <span class="sv${at.concededPerGame < ht.concededPerGame ? " lead" : ""}">${at.concededPerGame}</span>
        </div>
        <div class="stat-row">
          <span class="sv${ht.possession >= at.possession ? " lead" : ""}">${ht.possession}%</span>
          <div class="sh"><div class="sh-fill" style="width:${posH}%;"></div></div>
          <span class="sn">${t.possession}</span>
          <div class="sa"><div class="sa-fill" style="width:${posA}%;"></div></div>
          <span class="sv${at.possession > ht.possession ? " lead" : ""}">${at.possession}%</span>
        </div>
        <div class="stat-row">
          <span class="sv${ht.cleanSheets >= at.cleanSheets ? " lead" : ""}">${ht.cleanSheets}</span>
          <div class="sh"><div class="sh-fill" style="width:${csH}%;"></div></div>
          <span class="sn">${t.cleanSheets}</span>
          <div class="sa"><div class="sa-fill" style="width:${csA}%;"></div></div>
          <span class="sv${at.cleanSheets > ht.cleanSheets ? " lead" : ""}">${at.cleanSheets}</span>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon" style="background:var(--green-dim);">\uD83D\uDCC8</span> ${t.recentForm}</div>
        <span class="card-chip">${t.last5}</span>
      </div>
      <div class="card-body">
        <div class="form-section">
          <div class="form-row">
            <div class="form-meta">
              <span class="form-flag">${ht.flag}</span>
              <span class="form-label">${ht.name}</span>
            </div>
            <div class="form-badges">
              ${formBadges(ht)}
            </div>
            <span class="form-record">${ht.formRecord}</span>
          </div>
          <div class="form-row">
            <div class="form-meta">
              <span class="form-flag">${at.flag}</span>
              <span class="form-label">${at.name}</span>
            </div>
            <div class="form-badges">
              ${formBadges(at)}
            </div>
            <span class="form-record">${at.formRecord}</span>
          </div>
        </div>
      </div>
    </div>
    ${h2hCard()}
    ${mktsCard()}
  </div>
  <div class="sidebar" style="display:flex;flex-direction:column;gap:1rem;">
    <div class="side-cta">
      <div class="side-cta-eyebrow">${t.welcomeOffer}</div>
      <div class="side-cta-headline">${g(brand.bonusHeadline)}</div>
      <div class="side-cta-sub">${g(brand.bonusSub)}</div>
      <a href="${aff}" class="side-cta-btn" target="_blank" rel="noopener">${g(brand.claimBonus)}</a>
    </div>
    ${playersCard()}
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="card-icon" style="background:var(--green-dim);">\uD83C\uDFDF\uFE0F</span> ${t.venueInfo}</div>
      </div>
      <div class="card-body">
        <div style="font-size:.85rem;font-weight:800;color:var(--t0);margin-bottom:.15rem;">${(m.venue || "TBC").split(",")[0]}</div>
        <div style="font-size:.72rem;color:var(--t2);margin-bottom:.65rem;">${(m.venue || "").split(",").slice(1).join(",").trim()}</div>
        ${m.venueCapacity ? '<div class="venue-row"><span class="venue-key">' + t.capacity + '</span><span class="venue-val">' + m.venueCapacity + '</span></div>' : ""}

// ── DATE HELPERS ─────────────────────────────────────────────────────────────
const MONTHS = {January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};

function parseDateKey(str) {
  const m = str.match(/(\d+)\s+(\w+)\s+(\d+)/);
  if (!m) return 0;
  return parseInt(m[3]) * 10000 + (MONTHS[m[2]] || 0) * 100 + parseInt(m[1]);
}

function shortDate(str) {
  // "Thursday, 11 June 2026" → "Thu 11 Jun"
  const m = str.match(/(\w+),\s*(\d+)\s+(\w+)\s+(\d+)/);
  if (!m) return str;
  return m[1].slice(0,3) + ' ' + m[2] + ' ' + m[3].slice(0,3) + ' ' + m[4];
}

function buildGroupPills() {

  groups.forEach(g => {

function filterGroup(group) {
  selectedGroup = group;

  });

    row.classList.toggle('hidden', group !== 'all' && rg !== group);
  });

  document.querySelectorAll('.match-row.hidden .match-check').forEach(c => { c.checked = false; });

}

// ── CALENDAR BUILD ────────────────────────────────────────────────────────────
function buildCalendar() {
  const sorted = [...MATCHES].sort((a, b) => parseDateKey(a.date) - parseDateKey(b.date));
  const byDate = {};
  const dateOrder = [];
  sorted.forEach(m => {
    if (!byDate[m.date]) { byDate[m.date] = []; dateOrder.push(m.date); }
    byDate[m.date].push(m);
  });

  const cal = document.getElementById('calendar');
  dateOrder.forEach(date => {
    const section = document.createElement('div');
    section.className = 'date-section';

    section.innerHTML =
      '<div class="date-header">' +
        '<div class="date-header-line"></div>' +
        '<div class="date-header-text">' + date + '</div>' +
        '<div class="date-header-line"></div>' +
      '</div>' +
      '<div class="match-list" id="list-' + date.replace(/[^a-z0-9]/gi,'_') + '"></div>';

    cal.appendChild(section);

    const list = section.querySelector('.match-list');
    byDate[date].forEach(m => {
      list.appendChild(buildMatchRow(m));
    });
  });
}

function buildMatchRow(m) {

// ── GENERATE ──────────────────────────────────────────────────────────────────
function getHTML(id) {
  const m = MATCHES.find(x => x.id === id) || LIVE_MATCHES.find(x => x.id === id);
  if (!m) throw new Error('Match not found: ' + id);
  return generateMatchHTML(m, selectedBrand, selectedLang);
}

function downloadMatch(id) {
  try {
    const blob = new Blob([getHTML(id)], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'match-' + id + '-' + selectedBrand.id + '-' + selectedLang + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    markGenerated(id);
    log('Downloaded: match-' + id + '-' + selectedBrand.id + '-' + selectedLang + '.html', 'ok');
  } catch(e) { log('Error: ' + e.message, 'warn'); }
}

function previewMatch(id) {
  try {
    const blob = new Blob([getHTML(id)], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
    log('Previewing: ' + id + ' [' + selectedBrand.name + ' / ' + selectedLang.toUpperCase() + ']', 'info');
  } catch(e) { log('Error: ' + e.message, 'warn'); }
}

function markGenerated(id) {
  generated.add(id);
  const pill = document.getElementById('pill-' + id);
  if (pill) { pill.className = 'status-pill ready'; pill.textContent = 'Generated'; }
  const row = document.getElementById('row-' + id);
  if (row) row.classList.add('generated');
}

async function generateSelected() {
  const ids = [...document.querySelectorAll('.match-check:checked')].map(c => c.id.replace('chk-', ''));
  await runBatch(ids);
}

async function generateAll() {
  const ids = [...MATCHES, ...LIVE_MATCHES].map(m => m.id);
  await runBatch(ids);
}

async function runBatch(ids) {
  if (!ids.length) return;
  const wrap = document.getElementById('progressWrap');
  const bar  = document.getElementById('progressBar');
  const lbl  = document.getElementById('progressLabel');
  wrap.classList.add('visible');
  log('Batch start: ' + ids.length + ' match(es) — ' + selectedBrand.name + ' / ' + selectedLang.toUpperCase(), 'info');
  for (let i = 0; i < ids.length; i++) {
    bar.style.width = Math.round((i / ids.length) * 100) + '%';
    lbl.textContent = 'Generating ' + (i + 1) + ' / ' + ids.length + ': ' + ids[i];
    await new Promise(r => setTimeout(r, 60));
    downloadMatch(ids[i]);
  }
  bar.style.width = '100%';
  lbl.textContent = 'Done — ' + ids.length + ' file(s) downloaded.';
  log('Batch complete: ' + ids.length + ' file(s).', 'ok');
  setTimeout(() => { wrap.classList.remove('visible'); bar.style.width = '0%'; }, 4000);
}

function getTeamFlag(name) { return FLAG_MAP[name] || '\uD83C\uDFF3\uFE0F'; }

function teamCode(name) { return name.replace(/^(United |South |North |Costa |Saudi )/, '').slice(0,3).toUpperCase(); }

function fmtDate(iso) {
  var d = new Date(iso);
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + months[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function fmtTime(iso) {
  var d = new Date(iso);
  return String(d.getUTCHours()).padStart(2,'0') + ':' + String(d.getUTCMinutes()).padStart(2,'0');
}

function makeMatchId(a, b) {
  return [a, b].map(function(n) { return n.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,''); }).join('-');
}

function buildMinimalMatch(entry, league) {
  var tA = entry.home_team, tB = entry.away_team;
  var lge = league || LEAGUES[0];
  var market = null;
  for (var bi = 0; bi < (entry.bookmakers || []).length; bi++) {
    var mk = (entry.bookmakers[bi].markets || []).find(function(x){ return x.key === 'h2h'; });
    if (mk) { market = mk; break; }
  }
  var homeOdds = 2.50, drawOdds = 3.20, awayOdds = 3.00;
  if (market) {
    (market.outcomes || []).forEach(function(o) {
      if (o.name === tA) homeOdds = o.price;
      else if (o.name === tB) awayOdds = o.price;
      else if (o.name === 'Draw') drawOdds = o.price;
    });
  }
  var total = 1/homeOdds + 1/drawOdds + 1/awayOdds;
  var pH = Math.round((1/homeOdds)/total*100);
  var pD = Math.round((1/drawOdds)/total*100);
  var pA = 100 - pH - pD;
  var fav = pH > pA ? tA : tB;
  var lgName = lge.name;
  var round = lge.round;

  function emptyTeam(name) {
    return { name: name, flag: getTeamFlag(name), code: teamCode(name),
             fifa: 0, role: '', elo: 0, squadValue: '\u2014',
             goalsPerGame: 0, concededPerGame: 0, possession: 50, cleanSheets: 0,
             form: [], formRecord: '\u2014', players: [] };
  }

  return {
    id: lge.key.replace('soccer_','').replace(/_/g,'-') + '--' + makeMatchId(tA, tB),
    tournament: lgName,
    homeTeam: emptyTeam(tA),
    awayTeam: emptyTeam(tB),
    kickoff: fmtTime(entry.commence_time),
    date: fmtDate(entry.commence_time),
    venue: 'TBC', venueCapacity: '', venueSurface: '', kickoffLocal: '', kickoffCET: '',
    group: round,
    odds: { home: homeOdds, draw: drawOdds, away: awayOdds },
    probHome: pH, probDraw: pD, probAway: pA,
    previewLines: {
      en: [tA + ' host ' + tB + ' in a ' + lgName + ' fixture.',
           'Both sides will be looking to claim all three points in what promises to be a competitive encounter.'],
      de: [tA + ' empf\u00e4ngt ' + tB + ' in der ' + lgName + '.',
           'Beide Teams wollen die drei Punkte \u2014 es verspricht ein hart umk\u00e4mpftes Spiel zu werden.'],
      tr: [tA + ', ' + lgName + ' ma\u00e7\u0131nda ' + tB + ' ile evinde kar\u015f\u0131la\u015f\u0131yor.',
           'Her iki tak\u0131m da \u00fc\u00e7 puan pe\u015finde olacak \u2014 zorlu bir m\u00fccadele bekleniyor.'],
    },
    previewHighlight: {
      en: '<strong>Odds:</strong> ' + tA + ' ' + homeOdds.toFixed(2) + ' &middot; Draw ' + drawOdds.toFixed(2) + ' &middot; ' + tB + ' ' + awayOdds.toFixed(2) + ' \u2014 <strong>' + fav + '</strong> slight favourites.',
      de: '<strong>Quoten:</strong> ' + tA + ' ' + homeOdds.toFixed(2) + ' &middot; Unentsch. ' + drawOdds.toFixed(2) + ' &middot; ' + tB + ' ' + awayOdds.toFixed(2) + ' \u2014 <strong>' + fav + '</strong> leichter Favorit.',
      tr: '<strong>Oranlar:</strong> ' + tA + ' ' + homeOdds.toFixed(2) + ' &middot; Berab. ' + drawOdds.toFixed(2) + ' &middot; ' + tB + ' ' + awayOdds.toFixed(2) + ' \u2014 <strong>' + fav + '</strong> hafif favori.',
    },
    h2h: null, markets: null, stats: [],
  };
}

// Fetches real sport list from API and rebuilds the league dropdown with correct keys
async function discoverLeagues() {
  var key = document.getElementById('apiKey').value.trim() || localStorage.getItem('oddsApiKey') || '';
  if (!key) {
    document.getElementById('liveStatus').textContent = '\u26A0 Enter your API key first, then click Discover';
    document.getElementById('liveStatus').className = 'live-status err';
    return;
  }
  localStorage.setItem('oddsApiKey', key);
  document.getElementById('liveStatus').textContent = 'Discovering available leagues\u2026';
  document.getElementById('liveStatus').className = 'live-status';

  try {
    var resp = await fetch('https://api.the-odds-api.com/v4/sports/?apiKey=' + key);
    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' \u2014 check your key');
    var sports = await resp.json();
    // Filter active soccer leagues only
    var soccer = sports.filter(function(s) {
      return s.active && (s.group === 'Soccer' || (s.key && s.key.startsWith('soccer_')));
    });
    if (!soccer.length) throw new Error('No active soccer leagues found for this key');

    var sel = document.getElementById('leagueSel');
    sel.innerHTML = '';
    soccer.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.key;
      opt.textContent = s.description || s.title || s.key;
      sel.appendChild(opt);
    });
    // Try to pre-select Bundesliga or World Cup if present
    var preferred = ['soccer_germany_bundesliga','soccer_fifa_world_cup','soccer_epl'];
    for (var p = 0; p < preferred.length; p++) {
      var found = soccer.find(function(s){ return s.key === preferred[p]; });
      if (found) { sel.value = found.key; break; }
    }
    var remaining = resp.headers.get('x-requests-remaining');
    document.getElementById('liveStatus').textContent = '\u2714 Found ' + soccer.length + ' soccer leagues. Requests left: ' + (remaining || '?') + ' \u2014 now pick a league & click Load.';
    document.getElementById('liveStatus').className = 'live-status ok';
    log('Discovered ' + soccer.length + ' soccer leagues.', 'ok');
  } catch(e) {
    document.getElementById('liveStatus').textContent = '\u2716 ' + e.message;
    document.getElementById('liveStatus').className = 'live-status err';
    log('Discover failed: ' + e.message, 'warn');
  }
}

async function loadLiveMatches() {
  var key = document.getElementById('apiKey').value.trim() || localStorage.getItem('oddsApiKey') || '';
  var sel = document.getElementById('leagueSel');
  var sportKey = sel.value;
  var leagueName = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : sportKey;
  // Try to get a short round name from LEAGUES fallback, else use full name
  var leagueObj = LEAGUES.find(function(l){ return l.key === sportKey; });
  var league = leagueObj || { key: sportKey, name: leagueName, round: leagueName };
  if (!key) {
    document.getElementById('liveStatus').textContent = '\u26A0 Enter your Odds API key first';
    document.getElementById('liveStatus').className = 'live-status err';
    return;
  }
  document.getElementById('apiKey').value = key;
  localStorage.setItem('oddsApiKey', key);
  document.getElementById('liveStatus').textContent = 'Fetching ' + league.name + '\u2026';
  document.getElementById('liveStatus').className = 'live-status';

  var url = 'https://api.the-odds-api.com/v4/sports/' + league.key + '/odds/?apiKey=' + key + '&regions=eu,uk&markets=h2h&oddsFormat=decimal';
  try {
    var resp = await fetch(url);
    if (!resp.ok) {
      var err = await resp.text();
      throw new Error('HTTP ' + resp.status + ': ' + err.slice(0,120));
    }
    var data = await resp.json();
    var added = 0;
    data.forEach(function(entry) {
      var match = buildMinimalMatch(entry, league);
      var id = match.id;
      if (MATCHES.find(function(x){ return x.id === id; })) return;
      if (LIVE_MATCHES.find(function(x){ return x.id === id; })) return;
      LIVE_MATCHES.push(match);
      addMatchToCalendar(match);
      added++;
    });
    var remaining = resp.headers.get('x-requests-remaining');
    document.getElementById('liveStatus').textContent = '\u2714 ' + league.name + ': ' + data.length + ' matches loaded (' + added + ' new). Requests left: ' + (remaining || '?');
    document.getElementById('liveStatus').className = 'live-status ok';
    log('Loaded ' + added + ' new matches for ' + league.name + '.', 'ok');
  } catch(e) {
    document.getElementById('liveStatus').textContent = '\u2716 ' + e.message;
    document.getElementById('liveStatus').className = 'live-status err';
    log('Live fetch failed: ' + e.message, 'warn');
  }
}

// Adds a single match to the calendar DOM (finds or creates the date section)
function addMatchToCalendar(m) {
  var cal = document.getElementById('calendar');
  var dateKey = 'list-' + m.date.replace(/[^a-z0-9]/gi,'_');
  var list = document.getElementById(dateKey);
  if (!list) {
    var section = document.createElement('div');
    section.className = 'date-section';
    section.innerHTML =
      '<div class="date-header">' +
        '<div class="date-header-line"></div>' +
        '<div class="date-header-text">' + m.date + '</div>' +
        '<div class="date-header-line"></div>' +
      '</div>' +
      '<div class="match-list" id="' + dateKey + '"></div>';
    // Insert in date order
    var newKey = parseDateKey(m.date);
    var inserted = false;
    var sections = cal.querySelectorAll('.date-section');
    for (var i = 0; i < sections.length; i++) {
      var hdr = sections[i].querySelector('.date-header-text');
      if (hdr && parseDateKey(hdr.textContent) > newKey) {
        cal.insertBefore(section, sections[i]);
        inserted = true;
        break;
      }
    }
    if (!inserted) cal.appendChild(section);
    list = section.querySelector('.match-list');
  }
  list.appendChild(buildMatchRow(m));
  // Update group pills if group not present
  var existing = document.querySelector('.gf-pill[data-group="' + m.group + '"]');
  if (!existing && m.group !== 'all') {
    var container = document.getElementById('groupPills');
    var btn = document.createElement('button');
    btn.className = 'gf-pill';
    btn.dataset.group = m.group;
    btn.textContent = m.group;
    btn.onclick = function() { filterGroup(m.group); };
    container.appendChild(btn);
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildBrandSelect();
buildGroupPills();
buildCalendar();
// Populate league selector with sport key as value
(function() {
  var sel = document.getElementById('leagueSel');
  LEAGUES.forEach(function(lg) {
    var opt = document.createElement('option');
    opt.value = lg.key;
    opt.textContent = lg.name;
    sel.appendChild(opt);
  });
  // Restore saved API key
  var savedKey = localStorage.getItem('oddsApiKey');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
})();
</script>
